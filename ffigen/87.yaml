output: '../lib/src/mldsa87_bindings.dart'
name: 'MLDSA87'
description: 'Holds ffigen generated implementation bindings for MLDSA87'
headers:
  entry-points:
    - '../src/include/mldsa87_api.h'
comments: true
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names

ffi-native:
  asset-id: 'package:mldsa_native/src/mldsa87_bindings.dart'
  enabled: true

functions:
  include:
    - 'mldsa87.*'

# ADD THIS: This stops the flood of system typedefs
typedefs:
  include:
    - 'mldsa87.*'  # Only include typedefs starting with mlkem512
  exclude:
    - '.*'          # Explicitly exclude everything else just to be safe

structs:
  exclude:
    - '.*'

unions:
  exclude:
    - '.*'

# ALSO CONSIDER: If you have global variables you don't want
globals:
  exclude:
    - '.*'

macros:
  include:
    - '^MLDSA87.*'